<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fff4d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="だっだぁー">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-book.png">
  <link rel="icon" href="./icons/icon-192-book.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>おはなし絵本 🐸</title>
</head>
<body>
  <main id="app">
    <section id="menu" class="menu-screen">
      <div class="update-tools"><span id="appVersion"></span><button id="updateBtn" type="button">更新して再起動</button></div>
      <div class="menu-card">
        <h1>おはなし絵本 🐸</h1>
        <div id="contentList" class="content-list"></div>
        <fieldset class="timing-box">
          <legend>各画面の表示時間</legend>
          <label><input type="radio" name="timing" value="5000"> 5秒</label>
          <label><input type="radio" name="timing" value="10000" checked> 10秒</label>
          <label><input type="radio" name="timing" value="speech"> 読み上げ終わるまで</label>
        </fieldset>

        <div class="folder-entry"><button id="folderBtn" class="mode-button mode-folder" type="button">フォルダから読み込む</button></div>
        <input id="folderInput" type="file" webkitdirectory multiple hidden>
        <a class="print-entry" href="./print.html">📖 印刷・PDF保存</a>
        <p id="menuStatus" class="menu-status">最初のタップを音声開始のきっかけにします。</p>
        <p id="updateStatus" class="menu-status" role="status" aria-live="polite">オフライン保存を確認しています…</p>
      </div>
    </section>

    <section id="viewer" class="viewer" hidden>
      <button id="homeBtn" class="home-button" type="button" aria-label="タイトルへ戻る">🏡</button>
      <img id="mainImage" class="main-image" alt="" draggable="false">

      <button id="prevBtn" class="peek peek-left" type="button" aria-label="前の画面" hidden>
        <img id="prevThumb" alt="">
        <span>‹</span>
      </button>
      <button id="nextBtn" class="peek peek-right" type="button" aria-label="次の画面" hidden>
        <img id="nextThumb" alt="">
        <span>›</span>
      </button>

      <div id="pageDots" class="page-dots" aria-hidden="true"></div>
      <nav class="page-controls" aria-label="ページ操作">
        <button id="backPageBtn" type="button" aria-label="前のページへ戻る">戻る</button>
        <button id="pauseBtn" type="button" aria-label="一時停止" aria-pressed="false">Ⅱ</button>
        <button id="forwardPageBtn" type="button" aria-label="次のページへ進む">進む</button>
      </nav>
    </section>
  </main>

  <script src="./version.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./update.js" defer></script>
</body>
</html>
